name: Micro Blog

on:
  issues:
    types: [opened]

# 默认只读；具体 job 再按最小权限提权
permissions:
  contents: read

# 同一时间只处理一条微记录，避免并发 push 冲突
concurrency:
  group: micro-blog
  cancel-in-progress: false

jobs:
  micro:
    name: Create micro post
    # 只允许仓库所有者自己开的 issue 触发，避免公开仓库被任意 issue 调用写权限流程
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or delete micro post
        env:
          # issue 内容只能通过 env 传入，不能直接插进 run 脚本
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # 删除指令：标题形如 "!delete 2026-11-24-1702-27"（来自想法页的删除按钮）
          if printf '%s' "$ISSUE_TITLE" | grep -Eq '^!delete[[:space:]]+[A-Za-z0-9._-]+$'; then
            NAME="$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^!delete[[:space:]]+//')"
            FILE="content/micro/${NAME}.md"
            if [ -f "$FILE" ]; then
              git rm --quiet -- "$FILE"
              echo "MICRO_MODE=delete" >> "$GITHUB_ENV"
            else
              echo "文件不存在，跳过删除：$FILE"
              echo "MICRO_MODE=none" >> "$GITHUB_ENV"
            fi
            echo "MICRO_FILE=$FILE" >> "$GITHUB_ENV"
            exit 0
          fi

          DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d-%H%M")
          FILE="content/micro/${DATE}-${ISSUE_NUMBER}.md"

          # 正文优先：博客页的发布框把完整内容放在 body，标题只当摘要（绕开标题 256 字上限）；
          # 直接在 GitHub 上只写标题也照样能用。
          CONTENT="$ISSUE_TITLE"
          BODY_TRIMMED="$(printf '%s' "${ISSUE_BODY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$BODY_TRIMMED" ]; then
            CONTENT="$ISSUE_BODY"
          fi

          mkdir -p content/micro
          {
            printf -- '---\n'
            printf 'date: %s\n' "$(TZ=Asia/Shanghai date -Iseconds)"
            printf 'type: micro\n'
            printf 'draft: false\n'
            printf -- '---\n\n'
            printf '%s\n' "$CONTENT"
          } > "$FILE"

          echo "MICRO_MODE=create" >> "$GITHUB_ENV"
          echo "MICRO_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Commit and push
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${MICRO_MODE}" = "delete" ]; then
            # 上一步 git rm 已经把删除暂存好了，这里不能再 git add（路径已不存在会报 pathspec）
            git commit -m "micro: 删除 ${MICRO_FILE#content/micro/}"
          elif [ "${MICRO_MODE}" = "create" ]; then
            git add -- "${MICRO_FILE}"
            git commit -m "micro: ${ISSUE_TITLE}"
          else
            echo "没有需要提交的改动"
            exit 0
          fi

          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Build and deploy
    needs: micro
    runs-on: ubuntu-latest
    # 和 hugo.yml 共用 pages 组，避免两处同时发布互相打架
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.0'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 产物刚上传完时偶发取不到（"Found 0 artifact(s)"），失败后稍等再试一次
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  close:
    name: Close issue
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
