{{- /*
  想法页的删除入口。
  只在保存过 Token 的浏览器里注入按钮，读者看不到。
  点删除后先在本地立即隐藏（localStorage 记录，30 分钟内有效），
  同时创建一条 "!delete <文件名>" 的 Issue，由 microblog workflow 删文件并部署。
  Issue 关闭（部署完成）后刷新页面，条目就真的没了。
*/ -}}
<script>
(function () {
  var REPO = {{ site.Params.giscus.repo | jsonify | safeJS }};
  var KEY = "blog_micro_token";
  var HIDE_KEY = "blog_micro_hidden";
  var API = "https://api.github.com/repos/" + REPO + "/issues";
  var MAX_TRIES = 40;

  var tok = "";
  try { tok = localStorage.getItem(KEY) || ""; } catch (e) {}
  if (!tok) { return; }

  var H = {
    "Authorization": "Bearer " + tok,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  };

  function span(text, cls) {
    var el = document.createElement("span");
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function button(text, cls) {
    var el = document.createElement("button");
    el.type = "button";
    el.className = cls;
    el.textContent = text;
    return el;
  }

  function readHidden() {
    var map = {};
    try { map = JSON.parse(localStorage.getItem(HIDE_KEY) || "{}") || {}; } catch (e) { map = {}; }
    var now = Date.now();
    Object.keys(map).forEach(function (k) {
      if (!map[k] || now - map[k] > 30 * 60 * 1000) { delete map[k]; }
    });
    return map;
  }

  function writeHidden(map) {
    try { localStorage.setItem(HIDE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function hideRow(id) {
    if (!id) { return; }
    var el = document.getElementById(id);
    if (el) { el.style.display = "none"; el.setAttribute("data-deleting", "1"); }
    var map = readHidden();
    map[id] = Date.now();
    writeHidden(map);
  }

  function unhideRow(id) {
    if (!id) { return; }
    var el = document.getElementById(id);
    if (el) { el.style.display = ""; el.removeAttribute("data-deleting"); }
    var map = readHidden();
    delete map[id];
    writeHidden(map);
  }

  function clearHidden(id) {
    var map = readHidden();
    delete map[id];
    writeHidden(map);
  }

  function toast(msg, kind) {
    var t = document.createElement("div");
    t.className = "micro-toast" + (kind ? " micro-toast-" + kind : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 7000);
  }

  function createIssue(title) {
    return fetch(API, {
      method: "POST",
      headers: H,
      body: JSON.stringify({ title: title, body: "" })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
    });
  }

  function waitClosed(num, id, tries) {
    tries = tries || 0;
    if (tries > MAX_TRIES) {
      unhideRow(id);
      toast("删除没完成（超过 5 分钟），可能部署失败，去 Actions 看看", "err");
      return;
    }
    setTimeout(function () {
      fetch(API + "/" + num, { headers: H })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.state === "closed") {
            clearHidden(id);
            location.reload();
          } else {
            waitClosed(num, id, tries + 1);
          }
        })
        .catch(function () { waitClosed(num, id, tries + 1); });
    }, 8000);
  }

  function renderIdle(post, id, bar) {
    bar.innerHTML = "";
    var del = button("删除", "micro-del");
    del.title = "删除这条想法（会提交到仓库并重新部署）";
    del.addEventListener("click", function () { renderConfirm(post, id, bar); });
    bar.appendChild(del);
  }

  function renderConfirm(post, id, bar) {
    bar.innerHTML = "";
    bar.appendChild(span("确定删除？", "micro-del-msg"));
    var ok = button("确认", "micro-del-ok");
    var cancel = button("取消", "micro-del-cancel");
    bar.appendChild(ok);
    bar.appendChild(cancel);

    cancel.addEventListener("click", function () { renderIdle(post, id, bar); });
    ok.addEventListener("click", function () {
      // 先本地隐藏，页面立刻见效
      hideRow(id);
      toast("已提交删除，正在同步（通常 1 分钟内）");

      createIssue("!delete " + id).then(function (res) {
        if (res.ok && res.data && res.data.number) {
          waitClosed(res.data.number, id);
        } else {
          unhideRow(id);
          if (res.status === 401) {
            toast("Token 失效，删除未提交", "err");
          } else {
            toast("删除失败：" + ((res.data && res.data.message) || res.status), "err");
          }
        }
      }).catch(function () {
        unhideRow(id);
        toast("网络错误，删除未提交", "err");
      });
    });
  }

  function init() {
    var hidden = readHidden();
    Object.keys(hidden).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) { el.style.display = "none"; el.setAttribute("data-deleting", "1"); }
    });

    document.querySelectorAll(".micro-post").forEach(function (post) {
      var id = post.id;
      if (!id) { return; }
      var date = post.querySelector(".micro-date");
      if (!date) { return; }
      var bar = span("", "micro-del-bar");
      date.appendChild(bar);
      renderIdle(post, id, bar);
    });
  }

  // 这个 partial 在列表之前渲染，要等 DOM 就绪
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
